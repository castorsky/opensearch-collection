    - name: Add some properties to mappings
      register: result
      castorsky.opensearch.opensearch_index:
        name: "checker-index"
        force: true
        settings:
          number_of_shards: 3
          codec: "zstd"
          number_of_replicas: 3
        mappings:
          dynamic_templates:
            - integers:
                mapping:
                  type: long
                  ignore_malformed: true
                match_mapping_type: long
            - strings:
                mapping:
                  ignore_above: 1024
                  type: keyword
                match_mapping_type: string
            - integers:
                mapping:
                  type: long
                  ignore_malformed: true
                match_mapping_type: long
        state: present

    - debug:
        var: result

