---
- name: Module test
  hosts: testgroup
  gather_facts: false
  tasks:
    - name: Retrieve info regarding cluster health info
      castorsky.opensearch.opensearch_health_info:
      register: result

    - name: Assert that the health info was retrieved successfully
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.health is defined
